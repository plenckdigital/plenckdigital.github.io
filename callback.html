<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectando ao Zé das Vendas</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f5f4;color:#1c1917;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
.c{background:#fff;border-radius:12px;padding:24px;max-width:420px;box-shadow:0 1px 3px #0001}code{word-break:break-all;background:#f5f5f4;padding:4px 6px;border-radius:6px}
a,button{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:8px;border:0;background:#2563eb;color:#fff;text-decoration:none;font:inherit;cursor:pointer}</style></head>
<body><div class="c" id="c"><h2>Conectando ao Zé das Vendas…</h2></div>
<script>
var p=new URLSearchParams(location.search),code=p.get('code'),err=p.get('error'),c=document.getElementById('c');
var ZE='https://ze-vendas-production.up.railway.app/painel';
if(code){location.replace(ZE+'#mlcode='+encodeURIComponent(code));
 c.innerHTML='<h2>Autorizado ✅</h2><p>Abrindo o painel do Zé pra terminar a conexão…</p><p>Se não abrir, copie este código e cole no painel (Contas → Conectar):</p><p><code>'+code.replace(/[<>&"]/g,'')+'</code></p><a href="'+ZE+'#mlcode='+encodeURIComponent(code)+'">Abrir o painel</a>';}
else{c.innerHTML='<h2>Não veio a autorização</h2><p>'+(err?'O Mercado Livre respondeu: '+String(p.get('error_description')||err).replace(/[<>&"]/g,''):'Volte ao painel do Zé e clique em conectar conta de novo.')+'</p><a href="'+ZE+'">Ir pro painel</a>';}
</script></body></html>
